route:
  receiver: slack_notifications
  group_by:
    - alertname
    - store
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack_notifications
    slack_configs:
      - api_url: "https://hooks.slack.com/services/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"
        channel: "#alerts"
        send_resolved: false
        http_config:
          tls_config:
            insecure_skip_verify: true

        title: "[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}"

        text: |
          {{ range .Alerts }}
          *Severity:* {{ .Labels.severity }}
          *Store:* {{ .Labels.store }}
          *Device:* {{ .Labels.instance }}

          {{ .Annotations.description }}

          {{ end }}
