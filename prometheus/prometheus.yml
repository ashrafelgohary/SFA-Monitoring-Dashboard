global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Alertmanager metrics (optional)
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # Host machine (Node Exporter in Docker with --net host on port 9100)
  - job_name: "host-node"
    static_configs:
      - targets: ["10.148.150.151:9100"]

  # Other Linux nodes (Node Exporter)
  - job_name: "linux-nodes"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "10.148.150.151:9100"
        labels:
          role: "pos-terminal"

  # cAdvisor (containers on the monitoring host)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]


  # Firewalls reachability via Blackbox ICMP probe
  - job_name: "firewalls"
    metrics_path: /probe
    params:
      module: [icmp]           # Use ping
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/firewalls_targets.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: 'SFA'
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/sfa.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
