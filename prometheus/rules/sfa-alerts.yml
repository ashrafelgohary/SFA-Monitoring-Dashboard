groups:
- name: sfa-alerts
  rules:

  - alert: DeviceDown
    expr: probe_success{job="SFA"} == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Device Down"
      description: "{{ $labels.store }} - {{ $labels.instance }} is not responding to ICMP ping for more than 10 minutes."

  - alert: StoreDown
    expr: count by (store) (probe_success{job="SFA"} == 0) == count by (store) (probe_success{job="SFA"})
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Store {{ $labels.store }} is DOWN"
      description: "All monitored devices in store {{ $labels.store }} are unreachable."
